name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.10"

      - name: Cache test dataset
        uses: actions/cache@v4
        with:
          path: TestData/processed_data.npz
          key: testdata-processed_data-v1

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -v
